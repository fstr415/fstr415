<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="magi system panels">
<defs>
<pattern id="mgrid" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#ff6a00" stroke-opacity="0.07"/>
</pattern>
<pattern id="mscan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="2" fill="#000" fill-opacity="0.3"/>
</pattern>
</defs>
<rect width="1000" height="220" fill="#050505"/>
<rect width="1000" height="220" fill="url(#mgrid)"/>

<text x="500" y="26" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="7" fill="#ff6a00">M A G I   S Y S T E M</text>

<g>
<g transform="translate(30 44)">
<rect width="300" height="150" fill="#0d0d0d" stroke="#ff6a00" stroke-width="2"/>
<text x="14" y="28" font-family="monospace" font-size="15" fill="#ff6a00">MELCHIOR · 01</text>
<text x="14" y="52" font-family="monospace" font-size="12" fill="#9a9a9a">javascript</text>
<rect x="14" y="62" width="272" height="10" fill="#1a1a1a"/>
<rect x="14" y="62" width="0" height="10" fill="#ff6a00"><animate attributeName="width" values="0;230" dur="1.8s" fill="freeze"/></rect>
<text x="14" y="94" font-family="monospace" font-size="12" fill="#9a9a9a">luau</text>
<rect x="14" y="104" width="272" height="10" fill="#1a1a1a"/>
<rect x="14" y="104" width="0" height="10" fill="#ff6a00"><animate attributeName="width" values="0;190" dur="2.2s" fill="freeze"/></rect>
<text x="14" y="138" font-family="monospace" font-size="13" fill="#3ddc84">STATUS: ACCEPT<animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></text>
</g>

<g transform="translate(350 44)">
<rect width="300" height="150" fill="#0d0d0d" stroke="#ff6a00" stroke-width="2"/>
<text x="14" y="28" font-family="monospace" font-size="15" fill="#ff6a00">BALTHASAR · 02</text>
<text x="14" y="56" font-family="monospace" font-size="12" fill="#9a9a9a">sync ratio</text>
<text x="14" y="98" font-family="monospace" font-size="34" fill="#ffffff">62.3<tspan font-size="18" fill="#ff6a00">%</tspan></text>
<rect x="14" y="112" width="272" height="6" fill="#1a1a1a"/>
<rect x="14" y="112" width="0" height="6" fill="#c1121f"><animate attributeName="width" values="0;170" dur="2.6s" fill="freeze"/></rect>
<text x="14" y="138" font-family="monospace" font-size="13" fill="#3ddc84">STATUS: ACCEPT<animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></text>
</g>

<g transform="translate(670 44)">
<rect width="300" height="150" fill="#0d0d0d" stroke="#c1121f" stroke-width="2"/>
<text x="14" y="28" font-family="monospace" font-size="15" fill="#c1121f">CASPER · 03</text>
<text x="14" y="56" font-family="monospace" font-size="12" fill="#9a9a9a">sleep schedule</text>
<path d="M14 96 L44 96 L54 76 L68 116 L82 66 L96 106 L110 96 L286 96" fill="none" stroke="#c1121f" stroke-width="2">
<animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.3s" repeatCount="indefinite"/>
</path>
<text x="14" y="138" font-family="monospace" font-size="13" fill="#c1121f">STATUS: REJECT<animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></text>
</g>
</g>

<rect width="1000" height="220" fill="url(#mscan)"/>
</svg>
