<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-label="divider">
<rect width="1000" height="24" fill="#050505"/>
<line x1="0" y1="12" x2="1000" y2="12" stroke="#ff6a00" stroke-opacity="0.3" stroke-width="1"/>
<g fill="#ff6a00">
<rect x="0" y="6" width="70" height="12" opacity="0.9">
