</rect>
<rect x="0" y="9" width="24" height="6" opacity="0.5">
<animate attributeName="x" values="-24;1000" dur="4.6s" repeatCount="indefinite"/>
</rect>
</g>
<text x="500" y="17" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="6" fill="#ff6a00" opacity="0.55">NERV</text>
</svg>
