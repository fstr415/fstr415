<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="gods in his heaven, alls right with the world">
<defs>
<pattern id="fscan" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="2" fill="#000" fill-opacity="0.35"/>
</pattern>
<linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ff6a00" stop-opacity="0"/>
<stop offset="50%" stop-color="#ff6a00" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1000" height="160" fill="#000"/>
<rect x="60" y="28" width="880" height="2" fill="url(#fline)"/>
<rect x="60" y="132" width="880" height="2" fill="url(#fline)"/>

<text x="500" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="3" fill="#ff6a00">
GOD'S IN HIS HEAVEN
<animate attributeName="opacity" values="1;1;0.15;1;1" dur="6s" keyTimes="0;0.62;0.66;0.7;1" repeatCount="indefinite"/>
</text>
<text x="500" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="6" fill="#e6e6e6" opacity="0.85">
ALL'S RIGHT WITH THE WORLD
<animate attributeName="opacity" values="0.85;0.85;0.1;0.85" dur="6s" keyTimes="0;0.66;0.7;1" repeatCount="indefinite"/>
</text>

<circle cx="80" cy="80" r="5" fill="#c1121f">
<animate attributeName="fill-opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="920" cy="80" r="5" fill="#c1121f">
<animate attributeName="fill-opacity" values="0.15;1;0.15" dur="2s" repeatCount="indefinite"/>
</circle>

<rect width="1000" height="160" fill="url(#fscan)"/>
</svg>
